[package]
name = "diagrammer-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pest = { version = "2.7", default-features = false }
pest_derive = "2.7"
regex = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2"

